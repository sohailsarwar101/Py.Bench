<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Py.Bench — Sohail's Python Playground</title>
  <meta name="description" content="Run Python in your browser: write code, hit Run, and see the output instantly.">
  <meta name="author" content="Sohail Sarwar">
  <link rel="icon" href="https://sohail.vip/ui/favicons/favicon.ico" sizes="any" />
  <link rel="icon" href="https://sohail.vip/ui/favicons/favicon.svg" type="image/svg+xml">

  <!-- CodeMirror for editor + syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>

  <!-- Pyodide: runs real Python in the browser -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>

  <style>
    :root {
      --bg: #1e1f22;
      --bg-panel: #202124;
      --bg-editor: #282a36;
      --bg-console: #16171a;
      --border: #34353a;
      --text: #e6e6e6;
      --text-dim: #8a8d93;
      --accent: #7ee787;
      --accent-dim: #4b8f52;
      --amber: #ffb454;
      --red: #ff6b6b;
      --font-mono: "SF Mono", "JetBrains Mono", "Fira Code", Consolas, Menlo, monospace;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: #888888 transparent;

      &::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      &::-webkit-scrollbar-track {
        background: transparent;
      }

      &::-webkit-scrollbar-thumb {
        background-color: #888888;
        border-radius: 3px;
      }

      &::-webkit-scrollbar-thumb:hover {
        background-color: #555555;
      }
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ---------- Top bar ---------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      height: 40px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .brand .dots {
      display: flex;
      gap: 5px;
      margin-right: 4px;
    }

    .brand .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    .dot.red {
      background: #ff5f57;
    }

    .dot.amber {
      background: #febc2e;
    }

    .dot.green {
      background: #28c840;
    }

    .status {
      font-size: 12px;
      color: var(--text-dim);
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status .pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--amber);
      transition: background 0.2s;
    }

    .status.ready .pulse {
      background: var(--accent);
    }

    .status.busy .pulse {
      animation: blink 0.9s infinite;
      background: var(--amber);
    }

    .status.error .pulse {
      background: var(--red);
    }

    @keyframes blink {
      50% {
        opacity: 0.2;
      }
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button.run-btn {
      background: var(--accent);
      color: #0d1f0f;
      border: none;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: transform 0.08s, background 0.15s;
    }

    button.run-btn:hover:not(:disabled) {
      background: #92f79c;
    }

    button.run-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    button.run-btn:disabled {
      background: #3a3d3f;
      color: var(--text-dim);
      cursor: default;
    }

    [hidden] {
      display: none !important;
    }

    kbd {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      background: #101113;
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1px 5px;
      margin-left: 2px;
    }

    /* ---------- Split panes ---------- */
    .split {
      flex: 1;
      display: flex;
      min-height: 0;
      overflow: hidden;
    }

    .pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .pane-left {
      flex: 1 1 55%;
      border-right: 1px solid var(--border);
    }

    .pane-right {
      flex: 1 1 45%;
      background: var(--bg-console);
      display: flex;
      flex-direction: column;
    }

    .pane-header {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-size: 11px;
      font-family: var(--font-mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .copy-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--text-dim);
      cursor: pointer;
    }

    .copy-btn:hover {
      color: var(--text);
      border-color: var(--border);
    }

    .copy-btn.copied {
      color: var(--accent);
    }

    .filename {
      color: var(--text);
      opacity: 0.85;
    }

    .resizer {
      width: 5px;
      cursor: col-resize;
      background: var(--bg);
      flex-shrink: 0;
      position: relative;
    }

    .resizer:hover,
    .resizer.active {
      background: var(--accent-dim);
    }

    #editor {
      flex: 1;
      min-height: 280px;
      overflow: hidden;
    }

    /* CodeMirror overrides */
    .CodeMirror {
      height: 100% !important;
      font-family: var(--font-mono) !important;
      font-size: 13.5px;
      line-height: 1.55;
      background: var(--bg-editor) !important;
    }

    .CodeMirror-gutters {
      background: var(--bg-editor) !important;
      border-right: 1px solid #3a3c47 !important;
    }

    /* Corner where the X and Y scrollbars meet (defaults to white) */
    .CodeMirror-scrollbar-filler,
    .CodeMirror-gutter-filler {
      background: var(--bg-editor) !important;
    }

    .CodeMirror-linenumber {
      color: #565a6e !important;
    }

    .CodeMirror-cursor {
      border-left: 2px solid var(--accent) !important;
    }

    /* ---------- Console / output ---------- */
    #console {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px 16px;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #console .placeholder {
      color: var(--text-dim);
      font-style: italic;
    }

    #console .line-stdout {
      color: var(--text);
    }

    #console .line-stderr {
      color: var(--red);
    }

    #console .line-result {
      color: var(--accent);
    }

    #console .line-result::before {
      content: "→ ";
      color: var(--accent-dim);
    }

    #console .line-system {
      color: var(--text-dim);
    }

    #console .line-time {
      color: var(--text-dim);
      font-size: 11px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
    }

    #console::-webkit-scrollbar,
    .CodeMirror-vscrollbar::-webkit-scrollbar {
      width: 10px;
    }

    #console::-webkit-scrollbar-thumb {
      background: #34353a;
      border-radius: 5px;
    }

    #console::-webkit-scrollbar-track {
      background: transparent;
    }

    /* stdin prompt */
    .stdin-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
    }

    .stdin-row input {
      flex: 1;
      background: var(--bg-editor);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 4px;
      outline: none;
    }

    .stdin-row input:focus {
      border-color: var(--accent-dim);
    }

    .stdin-row span {
      color: var(--amber);
      font-family: var(--font-mono);
      font-size: 12px;
    }

    @media (max-width: 760px) {
      .split {
        flex-direction: column;
      }

      /* Stacked layout: give the editor real room, let the page scroll for the rest */
      .split {
        overflow-y: auto;
      }

      .pane-left {
        border-right: none;
        border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
        min-height: 65vh;
      }

      .pane-right {
        flex: 0 0 auto;
        min-height: 40vh;
      }

      .resizer {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="topbar">
      <div class="brand">
        <div class="dots">
          <div class="dot red"></div>
          <div class="dot amber"></div>
          <div class="dot green"></div>
        </div>
        Py.Bench
      </div>

      <div class="toolbar">
        <div class="status" id="status"><span class="pulse"></span><span id="statusText">loading runtime…</span></div>
        <button class="run-btn" id="runBtn" disabled>
          <span id="runLabel">Run</span> <kbd>⌘⏎</kbd>
        </button>
      </div>
    </div>

    <div class="split">
      <div class="pane pane-left">
        <div class="pane-header">
          <span class="filename">main.py</span>
          <span class="header-right">
            <span id="lineInfo">Ln 1, Col 1</span>
            <button class="copy-btn" id="clearCodeBtn" title="Clear code" aria-label="Clear code"><svg
                viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9a1 1 0 0 0 1 .9h4.6a1 1 0 0 0 1-.9L12 4M6.5 7v4M9.5 7v4" />
              </svg></button>
            <button class="copy-btn" id="copyCodeBtn" title="Copy code" aria-label="Copy code"><svg viewBox="0 0 16 16"
                width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                stroke-linejoin="round">
                <rect x="5.5" y="5.5" width="8" height="8" rx="1.5" />
                <path d="M10.5 5.5v-2a1.5 1.5 0 0 0-1.5-1.5H3.5A1.5 1.5 0 0 0 2 3.5V9a1.5 1.5 0 0 0 1.5 1.5h2" />
              </svg></button>
          </span>
        </div>
        <div id="editor"></div>
      </div>

      <div class="resizer" id="resizer"></div>

      <div class="pane pane-right">
        <div class="pane-header">
          <span>Output</span>
          <span class="header-right">
            <span id="runInfo"></span>
            <button class="copy-btn" id="clearBtn" title="Clear output" aria-label="Clear output"><svg
                viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9a1 1 0 0 0 1 .9h4.6a1 1 0 0 0 1-.9L12 4M6.5 7v4M9.5 7v4" />
              </svg></button>
            <button class="copy-btn" id="copyOutputBtn" title="Copy output" aria-label="Copy output"><svg
                viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="5.5" y="5.5" width="8" height="8" rx="1.5" />
                <path d="M10.5 5.5v-2a1.5 1.5 0 0 0-1.5-1.5H3.5A1.5 1.5 0 0 0 2 3.5V9a1.5 1.5 0 0 0 1.5 1.5h2" />
              </svg></button>
          </span>
        </div>
        <div id="console"><span class="placeholder">Output will appear here once you run your code.</span></div>
        <div class="stdin-row" id="stdinRow" style="display:none;">
          <span>input()</span>
          <input type="text" id="stdinInput" placeholder="Type input and press Enter…">
        </div>
      </div>
    </div>

  </div>

  <script>
    // ---------------- Editor setup ----------------
    const DEFAULT_CODE =
      `# Write Python here and hit Run ▶
# Third-party imports (numpy, pandas, scikit-learn, etc.) are
# fetched automatically on first use — just import and run.
`;

    const editor = CodeMirror(document.getElementById("editor"), {
      value: DEFAULT_CODE,
      mode: "python",
      theme: "dracula",
      lineNumbers: true,
      indentUnit: 4,
      tabSize: 4,
      indentWithTabs: false,
      matchBrackets: true,
      autoCloseBrackets: true,
      styleActiveLine: true,
      extraKeys: {
        // Always indent with 4 spaces, never a tab character (Python rejects mixing)
        Tab: (cm) => cm.somethingSelected() ? cm.indentSelection("add") : cm.execCommand("insertSoftTab"),
        "Shift-Tab": (cm) => cm.indentSelection("subtract"),
      },
    });

    editor.on("cursorActivity", () => {
      const c = editor.getCursor();
      document.getElementById("lineInfo").textContent = `Ln ${c.line + 1}, Col ${c.ch + 1}`;
    });

    // ---------------- Console helpers ----------------
    const consoleEl = document.getElementById("console");
    const runInfo = document.getElementById("runInfo");

    function clearConsole() {
      consoleEl.innerHTML = '<span class="placeholder">Output will appear here once you run your code.</span>';
      runInfo.textContent = "";
    }

    function appendLine(text, cls) {
      const placeholder = consoleEl.querySelector(".placeholder");
      if (placeholder) placeholder.remove();
      const span = document.createElement("div");
      span.className = "line-" + cls;
      span.textContent = text;
      consoleEl.appendChild(span);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    document.getElementById("clearBtn").addEventListener("click", clearConsole);

    // ---------------- Status helpers ----------------
    const statusEl = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    function setStatus(mode, text) {
      statusEl.className = "status " + mode;
      statusText.textContent = text;
    }

    // ---------------- stdin handling ----------------
    const stdinRow = document.getElementById("stdinRow");
    const stdinInput = document.getElementById("stdinInput");
    let stdinResolve = null;

    function requestInput(promptText) {
      if (promptText) appendLine(promptText, "system");
      stdinRow.style.display = "flex";
      stdinInput.value = "";
      stdinInput.focus();
      return new Promise((resolve) => { stdinResolve = resolve; });
    }

    stdinInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && stdinResolve) {
        const val = stdinInput.value;
        appendLine(">>> " + val, "system");
        stdinRow.style.display = "none";
        const resolve = stdinResolve;
        stdinResolve = null;
        resolve(val);
      }
    });

    // ---------------- Pyodide setup ----------------
    const runBtn = document.getElementById("runBtn");
    const runLabel = document.getElementById("runLabel");

    let pyodide = null;
    let running = false;

    async function boot() {
      try {
        await bootPyodide();
      } catch (err) {
        // Without this, a failed download leaves Run disabled with no clue why
        setStatus("error", "runtime failed to load");
        appendLine("Could not load the Python runtime: " + (err && err.message ? err.message : err), "stderr");
        appendLine("Check your connection (it loads from cdn.jsdelivr.net) and reload.", "system");
      }
    }

    async function bootPyodide() {
      setStatus("busy", "downloading Python runtime…");
      if (typeof loadPyodide !== "function") throw new Error("pyodide.js did not load");
      pyodide = await loadPyodide();

      // Route stdout/stderr line-by-line into our console
      pyodide.setStdout({ batched: (s) => appendLine(s, "stdout") });
      pyodide.setStderr({ batched: (s) => appendLine(s, "stderr") });

      // micropip lets us fetch pure-Python packages from PyPI at runtime
      // for anything not in Pyodide's built-in package repository.
      await pyodide.loadPackage("micropip");

      setStatus("ready", "ready");
      runBtn.disabled = false;
    }

    async function runCode() {
      if (running || !pyodide) return;
      running = true;
      runBtn.disabled = true;
      runLabel.textContent = "Running";
      setStatus("busy", "running…");
      clearConsole();

      const code = editor.getValue();
      const start = performance.now();

      try {
        // Scan the code's imports and fetch any matching packages
        // (numpy, pandas, scikit-learn, etc.) from Pyodide's built-in
        // package index before running.
        setStatus("busy", "resolving packages…");
        try {
          await pyodide.loadPackagesFromImports(code, {
            messageCallback: (m) => appendLine(m, "system"),
          });
        } catch (pkgErr) {
          // Non-fatal: fall through to the micropip pass below, which
          // covers plain PyPI packages that aren't in Pyodide's index.
        }

        // Best-effort micropip pass for anything still missing (pure-Python
        // packages from PyPI not bundled with Pyodide). Silently no-ops
        // per-module on failure so it never blocks a run.
        await pyodide.runPythonAsync(`
import re as __re, ast as __ast
try:
    import micropip
    __tree = __ast.parse(${JSON.stringify(code)})
    __mods = set()
    for __node in __ast.walk(__tree):
        if isinstance(__node, __ast.Import):
            for __n in __node.names:
                __mods.add(__n.name.split(".")[0])
        elif isinstance(__node, __ast.ImportFrom) and __node.module:
            __mods.add(__node.module.split(".")[0])
    import importlib
    for __m in __mods:
        try:
            importlib.import_module(__m)
        except ImportError:
            try:
                await micropip.install(__m)
            except Exception:
                pass
except Exception:
    pass
`);

        setStatus("busy", "running…");
        // Patch input() each run to bridge to our async stdin box.
        // pyodide.globals.set puts this directly into the Python global
        // namespace, so we reference it as a plain name (no "from js import").
        pyodide.globals.set("__request_input__", requestInput);
        await pyodide.runPythonAsync(`
import builtins

async def __ainput__(prompt=""):
    val = await __request_input__(prompt)
    return val

builtins.input = __ainput__
`);

        // runPythonAsync uses Pyodide's top-level-await transform, so a plain
        // `input()` call in user code (bound to our async __ainput__ above)
        // is automatically awaited even though the user didn't write "await".
        await pyodide.runPythonAsync(code);

        const elapsed = ((performance.now() - start) / 1000).toFixed(2);
        appendLine(`✓ finished in ${elapsed}s`, "time");
        runInfo.textContent = `${elapsed}s`;
        setStatus("ready", "ready");
      } catch (err) {
        const msg = err && err.message ? err.message : String(err);
        appendLine(msg, "stderr");
        setStatus("error", "error");
        runInfo.textContent = "failed";
      } finally {
        running = false;
        runBtn.disabled = false;
        runLabel.textContent = "Run";
      }
    }

    runBtn.addEventListener("click", runCode);

    document.addEventListener("keydown", (e) => {
      const isRunShortcut = (e.metaKey || e.ctrlKey) && e.key === "Enter";
      if (isRunShortcut) {
        e.preventDefault();
        runCode();
      }
    });

    // ---------------- Copy to clipboard ----------------
    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        // Fallback for non-secure contexts
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }
    }

    function wireCopy(btn, getText) {
      const original = btn.innerHTML;
      btn.addEventListener("click", async () => {
        await copyText(getText());
        btn.classList.add("copied");
        btn.innerHTML = "✓";
        setTimeout(() => {
          btn.classList.remove("copied");
          btn.innerHTML = original;
        }, 1200);
      });
    }

    document.getElementById("clearCodeBtn").addEventListener("click", () => {
      editor.setValue("");
      editor.focus();
    });

    wireCopy(document.getElementById("copyCodeBtn"), () => editor.getValue());
    wireCopy(document.getElementById("copyOutputBtn"), () =>
      consoleEl.querySelector(".placeholder") ? "" : consoleEl.innerText.trim());

    // ---------------- Resizable split ----------------
    const resizer = document.getElementById("resizer");
    const paneLeft = document.querySelector(".pane-left");
    let dragging = false;

    resizer.addEventListener("mousedown", () => {
      dragging = true;
      resizer.classList.add("active");
      document.body.style.userSelect = "none";
    });
    window.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      const splitEl = document.querySelector(".split");
      const rect = splitEl.getBoundingClientRect();
      let pct = ((e.clientX - rect.left) / rect.width) * 100;
      pct = Math.max(25, Math.min(75, pct));
      paneLeft.style.flex = `1 1 ${pct}%`;
      editor.refresh();
    });
    window.addEventListener("mouseup", () => {
      if (dragging) {
        dragging = false;
        resizer.classList.remove("active");
        document.body.style.userSelect = "";
      }
    });

    boot();
  </script>

</body>

</html>
